name: CareFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      CARE_FLOW_STORAGE_BACKEND: memory
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Wait for DynamoDB Local
        run: |
          for attempt in {1..30}; do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()" 2>/dev/null; then
              echo "DynamoDB Local is ready."
              exit 0
            fi
            echo "Waiting for DynamoDB Local..."
            sleep 2
          done
          echo "DynamoDB Local did not become ready."
          exit 1

      - name: Run backend tests
        working-directory: app/backend
        run: python -m pytest tests -q

  cloudformation-lint:
    name: CloudFormation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint==1.60.1

      - name: Validate CloudFormation templates
        run: cfn-lint infrastructure/cloudformation/*.yaml
