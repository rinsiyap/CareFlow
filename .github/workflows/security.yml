name: CareFlow Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build CareFlow backend image
        run: docker build -t careflow-backend:ci -f Dockerfile .

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: careflow-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image-report.json
          exit-code: '0'

      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-config-report.json
          exit-code: '0'

      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-filesystem-report.json
          exit-code: '0'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careflow-trivy-reports
          path: |
            trivy-image-report.json
            trivy-config-report.json
            trivy-filesystem-report.json
          if-no-files-found: warn
          retention-days: 14

